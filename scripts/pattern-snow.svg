<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <g stroke="#bababa" stroke-width="1.4" stroke-linecap="round" fill="none">
    <!-- big snowflake top-left -->
    <g transform="translate(28 28)">
      <line x1="0" y1="-13" x2="0" y2="13"/>
      <line x1="-11" y1="-7" x2="11" y2="7"/>
      <line x1="-11" y1="7" x2="11" y2="-7"/>
      <!-- tip barbs -->
      <line x1="0" y1="-13" x2="-3" y2="-10"/>
      <line x1="0" y1="-13" x2="3" y2="-10"/>
      <line x1="0" y1="13" x2="-3" y2="10"/>
      <line x1="0" y1="13" x2="3" y2="10"/>
      <line x1="11" y1="7" x2="9" y2="4"/>
      <line x1="11" y1="7" x2="13" y2="4"/>
      <line x1="-11" y1="-7" x2="-9" y2="-4"/>
      <line x1="-11" y1="-7" x2="-13" y2="-4"/>
    </g>
    <!-- medium snowflake center-right -->
    <g transform="translate(86 56) rotate(15)">
      <line x1="0" y1="-9" x2="0" y2="9"/>
      <line x1="-8" y1="-4" x2="8" y2="4"/>
      <line x1="-8" y1="4" x2="8" y2="-4"/>
    </g>
    <!-- medium snowflake bottom-center -->
    <g transform="translate(54 92) rotate(30)">
      <line x1="0" y1="-10" x2="0" y2="10"/>
      <line x1="-9" y1="0" x2="9" y2="0"/>
      <line x1="-6" y1="-6" x2="6" y2="6"/>
      <line x1="-6" y1="6" x2="6" y2="-6"/>
    </g>
    <!-- small plus sign / star bits scattered -->
    <g transform="translate(100 16)">
      <line x1="0" y1="-4" x2="0" y2="4"/>
      <line x1="-4" y1="0" x2="4" y2="0"/>
    </g>
    <g transform="translate(10 72)">
      <line x1="0" y1="-3" x2="0" y2="3"/>
      <line x1="-3" y1="-2" x2="3" y2="2"/>
      <line x1="-3" y1="2" x2="3" y2="-2"/>
    </g>
    <g transform="translate(104 100)">
      <line x1="0" y1="-5" x2="0" y2="5"/>
      <line x1="-4" y1="-3" x2="4" y2="3"/>
      <line x1="-4" y1="3" x2="4" y2="-3"/>
    </g>
  </g>
  <!-- a few solid dots -->
  <g fill="#c4c4c4">
    <circle cx="68"  cy="20"  r="1.5"/>
    <circle cx="18"  cy="50"  r="1.5"/>
    <circle cx="98"  cy="78"  r="1.5"/>
    <circle cx="40"  cy="60"  r="1.2"/>
    <circle cx="74"  cy="110" r="1.2"/>
  </g>
</svg>
