<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TRMNL Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 4-shade palette levels post-quantize. Use these exact values so
         what the panel sees matches what the renderer sees. */
      --ink:   #000000;   /* level 0  */
      --dim:   #555555;   /* level 85 */
      --grey:  #AAAAAA;   /* level 170 */
      --paper: #FFFFFF;   /* level 255 */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100vh; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-feature-settings: "tnum" 1;
      display: flex;
      flex-direction: column;
      padding: 14px 22px 16px;
    }

    /* ── header ─────────────────────────────────────────────────────── */
    .agenda-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 3px solid var(--ink);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .agenda-header .dow {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    .agenda-header .label {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--dim);
    }

    /* ── event list ─────────────────────────────────────────────────── */
    .events {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
      flex: 1;
      min-height: 0;
    }
    .event {
      display: grid;
      grid-template-columns: 220px 1fr auto auto;
      align-items: center;
      gap: 12px;
      padding: 5px 0;
      font-size: 22px;
      line-height: 1.05;
      border-top: 1px solid var(--grey);
    }
    .event:first-child { border-top: 0; }

    .event .time {
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .event .title {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .event .badge {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 3px 10px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      white-space: nowrap;
    }
    .event .cal {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--dim);
      white-space: nowrap;
      min-width: 90px;
      text-align: right;
    }

    /* past events: collapse temp + cal labels into mid-grey so the
       palette quantizes them cleanly to level 170. No opacity (the
       browser blend doesn't snap deterministically). */
    .event.past .time,
    .event.past .title { color: var(--grey); }
    .event.past .cal   { color: var(--grey); }

    /* the next-up event: bold + black, no fade. The badge floats next
       to it carrying the "Xm until" countdown. */
    .event.next .time,
    .event.next .title { color: var(--ink); font-weight: 800; }

    /* all-day events sit above timed events naturally because their
       start is 00:00. The "ALL DAY" time label visually reads as
       distinct because of the all-caps + slight letter spacing. */
    .event.all-day .time { letter-spacing: 0.12em; }

    /* empty state */
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--grey);
    }
  </style>
</head>
<body>

  <header class="agenda-header">
    <span class="dow">{{ today_label }}</span>
    <span class="label">TODAY'S AGENDA</span>
  </header>

  {% if empty %}
    <div class="empty">NOTHING ON THE CALENDAR</div>
  {% else %}
    <ul class="events">
      {%- for e in events %}
      <li class="event{% if e.is_past %} past{% endif %}{% if e.is_next %} next{% endif %}{% if e.all_day %} all-day{% endif %}">
        <span class="time">{{ e.time_label }}</span>
        <span class="title">{{ e.title }}</span>
        <span class="badge">{% if e.is_next %}{{ e.minutes_until_text }}{% endif %}</span>
        <span class="cal">{{ e.calendar_label }}</span>
      </li>
      {%- endfor %}
    </ul>
  {% endif %}

</body>
</html>
