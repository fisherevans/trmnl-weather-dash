<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TRMNL Agenda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 4-shade palette levels post-quantize. Use these exact values so
         what the panel sees matches what the renderer sees. */
      --ink:   #000000;   /* level 0   */
      --dim:   #555555;   /* level 85  */
      --grey:  #AAAAAA;   /* level 170 */
      --paper: #FFFFFF;   /* level 255 */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; height: 100vh; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-feature-settings: "tnum" 1;
      display: flex;
      flex-direction: column;
      padding: 10px 14px 10px;
    }

    /* ── header ─────────────────────────────────────────────────────── */
    .agenda-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 3px solid var(--ink);
      padding-bottom: 4px;
      margin-bottom: 4px;
    }
    .agenda-header .dow {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .agenda-header .label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--dim);
      line-height: 1;
      white-space: nowrap;
    }

    /* ── event list ─────────────────────────────────────────────────── */
    .events {
      list-style: none;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    /* flex: 1 1 0 distributes the list's height across events. Sparse
       days get tall rows, full days compress. Combined with the
       density-* font-size tiers below, this gives the row content room
       to breathe at every event count. */
    .event {
      flex: 1 1 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto;
      align-content: center;
      row-gap: 2px;
      padding: 4px 0;
      border-top: 1px solid var(--grey);
    }
    .event:first-child { border-top: 0; }

    /* Top line: time range left, cal label right. Time is the
       supporting metadata (lighter, tracked, monospace digits via
       tnum); title carries the visual weight. */
    .event .meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .event .time {
      font-weight: 500;
      letter-spacing: 0.06em;
      white-space: nowrap;
      color: var(--dim);
    }
    .event .cal {
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--dim);
      white-space: nowrap;
    }
    .event .title {
      font-weight: 700;
      line-height: 1.0;
      letter-spacing: -0.005em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Past events: collapse text to mid-grey so the 4-shade quantizer
       lands them on level 170 (visible but distinctly faded). Opacity
       doesn't quantize predictably across only 4 levels. The title
       additionally takes a strikethrough so the "done" signal is
       legible at a glance even when the row is one of many. */
    .event.past .time,
    .event.past .title,
    .event.past .cal { color: var(--grey); }
    .event.past .title { text-decoration: line-through; text-decoration-thickness: 2px; }

    /* All-day events sit naturally at the top (start == 00:00). The
       ALL DAY label visually distinguishes by capitalization + extra
       tracking. */
    .event.all-day .time { letter-spacing: 0.16em; }

    /* ── density tiers ──────────────────────────────────────────────
       Picked in render.py based on event count. Tighter as the day
       fills up so all events fit; breathier on sparse days. */
    .density-xl .agenda-header .dow   { font-size: 30px; }
    .density-xl .agenda-header .label { font-size: 13px; }
    .density-xl .event .time   { font-size: 20px; }
    .density-xl .event .title  { font-size: 28px; }
    .density-xl .event .cal    { font-size: 14px; }

    .density-lg .agenda-header .dow   { font-size: 28px; }
    .density-lg .event .time   { font-size: 18px; }
    .density-lg .event .title  { font-size: 24px; }
    .density-lg .event .cal    { font-size: 13px; }

    .density-md .agenda-header .dow   { font-size: 26px; }
    .density-md .event .time   { font-size: 17px; }
    .density-md .event .title  { font-size: 22px; }
    .density-md .event .cal    { font-size: 13px; }

    .density-sm .agenda-header .dow   { font-size: 24px; }
    .density-sm .event .time   { font-size: 16px; }
    .density-sm .event .title  { font-size: 20px; }
    .density-sm .event .cal    { font-size: 12px; }

    .density-xs .agenda-header .dow   { font-size: 22px; }
    .density-xs .event .time   { font-size: 14px; }
    .density-xs .event .title  { font-size: 17px; }
    .density-xs .event .cal    { font-size: 11px; }

    /* empty state */
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--grey);
      padding: 0 18px;
    }
  </style>
</head>
<body class="{{ density }}">

  <header class="agenda-header">
    <span class="dow">{{ today_label }}</span>
    <span class="label">TODAY'S AGENDA</span>
  </header>

  {% if empty %}
    <div class="empty">NOTHING ON THE CALENDAR</div>
  {% else %}
    <ul class="events">
      {%- for e in events %}
      <li class="event{% if e.is_past %} past{% endif %}{% if e.all_day %} all-day{% endif %}">
        <div class="meta">
          <span class="time">{{ e.time_label }}</span>
          <span class="cal">{{ e.calendar_label }}</span>
        </div>
        <div class="title">{{ e.title }}</div>
      </li>
      {%- endfor %}
    </ul>
  {% endif %}

</body>
</html>
