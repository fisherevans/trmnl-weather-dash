name: release

# Builds and pushes a tagged image to GHCR on every `v*` tag.
# The version tag (`v1.2.3`) and `latest` both move to the new SHA.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write       # push to ghcr.io under fisherevans's namespace

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/trmnldash
          tags: |
            type=ref,event=tag       # the literal v1.2.3 tag
            type=raw,value=latest    # move :latest to the new sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
