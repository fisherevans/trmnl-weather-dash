name: edge

# Pushes an `:edge` image on every commit to main. Useful for iterating
# on deployments without cutting a real release tag.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push :edge
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/trmnldash:edge
            ghcr.io/${{ github.repository_owner }}/trmnldash:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
