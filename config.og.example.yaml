# Example trmnldash config for a host that runs BOTH the TRMNL X
# (1872x1404, 4-bit grey) and the TRMNL OG (800x480, 2-bit grey).
# One container, one HTTP listener, two dashboards on independent
# refresh schedules.
#
# Validate with: uv run trmnldash validate --config config.og.example.yaml
# Pass at runtime via --config or the TRMNLDASH_CONFIG env var.

dashboards:
  # ── TRMNL X: full-screen weather ─────────────────────────────────────
  - name: x
    dashboard:
      device:
        width:   1872
        height:  1404
        palette: 4bit-grey
        rotate:  0
      layout:
        panel: weather_landscape
        config:
          location:
            lat:  40.7128            # decimal degrees - example: NYC
            lon: -74.0060            # decimal degrees
            timezone: America/New_York
          weather:
            provider: open-meteo
            hours: 24
          home_assistant:
            base_url: http://homeassistant.local:8123
            token_env: HA_TOKEN
            sensors:
              outdoor_temp_f: sensor.outdoor_temperature
              outdoor_humidity: sensor.outdoor_humidity
              indoor_temp_f:
                - sensor.living_room_temperature
                - sensor.bedroom_temperature
              indoor_humidity:
                - sensor.living_room_humidity
          summary_side: left
    render:
      output_path: /data/x.png
      refresh_minutes: 1
    serve:
      secret_path: change-me-x-token

  # ── TRMNL OG: calendar agenda + compact weather ──────────────────────
  - name: og
    dashboard:
      device:
        width:   800
        height:  480
        palette: 2bit-grey
        rotate:  0
      layout:
        hstack:
          padding: 0
          gap: 0
          separator:
            thickness: 2
            color: "#000000"
          children:
            - panel: calendar_agenda
              size: 1fr
              config:
                timezone: America/New_York
                google:
                  credentials_file: /etc/trmnldash/og/google-credentials.json
                  token_file:       /etc/trmnldash/og/google-token.json
                  calendars:
                    - {id: "primary",                                                                                          label: "Personal"}
                    - {id: "your-work-calendar-id@group.calendar.google.com",                                                  label: "Work"}
                    - {id: "your-family-calendar-id@group.calendar.google.com",                                                label: "Family"}
                    - {id: "your-side-calendar-id@group.calendar.google.com",                                                  label: "Side"}
                max_events: 12

            - panel: weather_compact
              size: 1fr
              config:
                location:
                  lat:  40.7128       # decimal degrees - example: NYC
                  lon: -74.0060       # decimal degrees
                  timezone: America/New_York
                weather:
                  provider: open-meteo
                  hours: 18
    render:
      output_path: /data/og.png
      refresh_minutes: 5
    serve:
      secret_path: change-me-og-token

# ──────────────────────────────────────────────────────────────────────────
# Shared HTTP listener: both dashboards served from this host:port at
# their respective secret_paths.
#   X dash:   http://<host>:8080/change-me-x-token/dashboard.png
#   OG dash:  http://<host>:8080/change-me-og-token/dashboard.png
# ──────────────────────────────────────────────────────────────────────────
serve:
  host: 0.0.0.0
  port: 8080
