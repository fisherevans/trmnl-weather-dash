# Example docker-compose for trmnl-weather-dash. Copy to docker-compose.yml
# and adjust paths/ports. Secrets (HA_TOKEN, etc.) live in a sibling .env
# file — see .env.example. Do not commit your real .env.

services:
  trmnldash:
    image: ghcr.io/fisherevans/trmnl-weather-dash:latest
    container_name: trmnldash
    restart: unless-stopped

    # Do NOT add `init: true` here. The image's ENTRYPOINT is already
    # `/usr/bin/tini --` (see Dockerfile), which reaps chromium's
    # orphaned helpers as PID 1. Compose's `init: true` injects
    # docker-init as PID 1 and demotes the bundled tini to a child,
    # which then warns on every startup ("Tini is not running as PID 1
    # and isn't registered as a child subreaper"). Reaping still works
    # via docker-init but the bundled tini becomes redundant noise.

    # Secrets: HA_TOKEN (required), WEATHER_API_KEY (only for providers
    # that need one). The container reads them as env vars; the names
    # they're looked up under come from config.yaml's *_env fields.
    env_file: .env

    # Config lives outside the image so a redeploy just restarts the
    # container — no rebuild. The TRMNLDASH_CONFIG env var points at
    # the mount path.
    volumes:
      - ./config.yaml:/etc/trmnldash/config.yaml:ro
      - trmnldash-data:/data

    # Container always listens on 8080. Map to whatever host port your
    # Cloudflare tunnel / reverse proxy expects.
    ports:
      - "8090:8080"

    # /healthz returns 200 once the first render completes. Docker uses
    # this to mark the container "healthy" so `docker compose ps` and
    # any orchestrator (Portainer, Dockge, Nomad) shows a real status.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s   # first render takes ~2s — pad for cold start

volumes:
  # Named volume so the rendered PNG survives container restarts. Not
  # strictly required (the scheduler regenerates within refresh_minutes
  # of startup) but lets HTTP clients get an immediate hit.
  trmnldash-data:
