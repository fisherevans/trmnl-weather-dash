# trmnldash config — single file describes every dashboard this process serves.
# Validate with: uv run trmnldash validate --config <this-path>
# Pass at runtime via --config or the TRMNLDASH_CONFIG env var.

# ──────────────────────────────────────────────────────────────────────────
# Dashboards. One per entry; the scheduler runs each on its own
# `render.refresh_minutes` interval and the HTTP server mounts each at its
# own `serve.secret_path`. Names must be unique URL slugs; secret_paths
# and output_paths must be unique too (validated on load).
#
# Layout shape:
#   panel:  <name>       leaf, renders the named panel from trmnldash.panels
#   vstack: {...}        column with `children` + optional padding, gap,
#                        separator
#   hstack: {...}        row with `children` + optional padding, gap,
#                        separator
#
# Sizing inside a stack:
#   "1fr" (default)      equal share of remaining space
#   "240" / 240          fixed pixels
#   "50%"                percentage of the stack's main axis
# ──────────────────────────────────────────────────────────────────────────
dashboards:
  - name: weather
    dashboard:
      device:
        width: 1872
        height: 1404
        palette: 4bit-grey       # TRMNL X 10.3"
        rotate: 0
      layout:
        panel: weather_landscape
        # `size:` is ignored at the root - a bare panel fills the canvas.
        config:
          # Where the dashboard is for. Hourly forecast + sunset/sunrise +
          # tz-aware hour labels all depend on these.
          location:
            lat: 43.21
            lon: -71.54
            timezone: America/New_York

          weather:
            provider: open-meteo
            hours: 24
            # forecast_provider: derive    # derive (default) | nws

          home_assistant:
            base_url: http://homeassistant.local:8123
            token_env: HA_TOKEN
            sensors:
              outdoor_temp_f: sensor.outdoor_temperature
              outdoor_humidity: sensor.outdoor_humidity
              indoor_temp_f:
                - sensor.living_room_temperature
                - sensor.bedroom_temperature
              indoor_humidity:
                - sensor.living_room_humidity

          summary_side: left
    render:
      output_path: /data/weather.png
      refresh_minutes: 1
    serve:
      # Treat as a password - anyone with the URL reads the dashboard.
      # Generate with: openssl rand -hex 16
      secret_path: change-me-to-a-random-token

  # Add a second dashboard by repeating the block. Different `name`,
  # different `secret_path`, different `output_path`. Its refresh
  # cadence is independent of any other dashboard's.
  #
  # - name: og
  #   dashboard:
  #     device: {width: 800, height: 480, palette: 2bit-grey, rotate: 0}
  #     layout:
  #       hstack: {...}
  #   render:
  #     output_path: /data/og.png
  #     refresh_minutes: 5
  #   serve:
  #     secret_path: a-different-random-token

# ──────────────────────────────────────────────────────────────────────────
# Shared HTTP listener. Every dashboard's PNG is served from this host:port.
# ──────────────────────────────────────────────────────────────────────────
serve:
  host: 0.0.0.0
  port: 8080
