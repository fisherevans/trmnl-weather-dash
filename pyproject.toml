[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trmnldash"
version = "1.5.2"
description = "TRMNL dashboard suite: composable panels rendered to e-ink PNGs. First panel is a 1872x1404 16-grey weather dash for the 10.3\" TRMNL X."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Fisher Evans", email = "fisher@fisherevans.com" }]
dependencies = [
    "playwright>=1.44",
    "jinja2>=3.1",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "astral>=3.2",                  # local sunrise/sunset for providers (NWS) that don't supply it
    "google-api-python-client>=2.0", # Google Calendar source for the agenda panel
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",    # InstalledAppFlow for the one-shot auth bootstrap
]

[project.urls]
Homepage = "https://github.com/fisherevans/trmnldash"
Issues = "https://github.com/fisherevans/trmnldash/issues"

[project.scripts]
trmnldash = "trmnldash.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/trmnldash"]

[tool.hatch.build.targets.wheel.force-include]
"src/trmnldash/panels/weather_landscape/template.html" = "trmnldash/panels/weather_landscape/template.html"
"src/trmnldash/panels/weather_landscape/assets" = "trmnldash/panels/weather_landscape/assets"
"src/trmnldash/panels/calendar_agenda/template.html" = "trmnldash/panels/calendar_agenda/template.html"
"src/trmnldash/panels/weather_compact/template.html" = "trmnldash/panels/weather_compact/template.html"
"src/trmnldash/engine/fonts" = "trmnldash/engine/fonts"
