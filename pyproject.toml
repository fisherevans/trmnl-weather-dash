[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trmnldash"
version = "0.1.0"
description = "TRMNL dashboard suite: composable panels rendered to e-ink PNGs. First panel is a 1872x1404 16-grey weather dash for the 10.3\" TRMNL X."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Fisher Evans", email = "fisher@fisherevans.com" }]
dependencies = [
    "playwright>=1.44",
    "jinja2>=3.1",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "astral>=3.2",                  # local sunrise/sunset for providers (NWS) that don't supply it
]

[project.urls]
Homepage = "https://github.com/fisherevans/trmnl-weather-dash"
Issues = "https://github.com/fisherevans/trmnl-weather-dash/issues"

[project.scripts]
trmnldash = "trmnldash.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/trmnldash"]

[tool.hatch.build.targets.wheel.force-include]
"src/trmnldash/assets" = "trmnldash/assets"
